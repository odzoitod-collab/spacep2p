services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: p2p
      POSTGRES_PASSWORD: p2p
      POSTGRES_DB: p2p
    ports: ["127.0.0.1:5432:5432"]  # never expose the database to the internet
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
volumes:
  pgdata:
